name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Faster release compiles (slightly larger binary, fine for an indie app)
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "windows-release-nsis"
          cache-on-failure: true

      - name: Install frontend deps
        run: npm ci

      - name: Verify signing secret
        shell: pwsh
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RAW_KEY)) {
            throw "Secret TAURI_SIGNING_PRIVATE_KEY is missing or empty"
          }
          Write-Host ("Secret OK, length=" + $env:RAW_KEY.Trim().Length)

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Aquerty Stop ${{ github.ref_name }}
          releaseBody: |
            Update Aquerty Stop.

            Install the Windows setup, or use Settings > Check for updates.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis
          projectPath: .
